<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TournaMAXX Control</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c2410c'/%3E%3Cpath d='M8 9h16v4h-6v12h-4V13H8z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="card login-card">
    <div class="brand big"><span class="logo">T</span><div><b>TournaMAXX</b><small>Revival control panel</small></div></div>
    <label>User<input name="user" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <p class="error" id="login-error"></p>
    <button class="primary" type="submit">Log in</button>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="side">
    <div class="brand"><span class="logo">T</span><div><b>TournaMAXX</b><small id="host"></small></div></div>
    <nav id="nav">
      <a href="#dashboard">Dashboard</a>
      <a href="#tournaments">Tournaments</a>
      <a href="#cabinets">Cabinets</a>
      <a href="#players">Players</a>
      <a href="#updates">Updates</a>
      <a href="#log">Log</a>
      <a href="#settings">Settings</a>
    </nav>
    <div class="side-foot">
      <div id="svc-pill" class="pill">…</div>
      <button id="logout" class="link">Log out <span id="who"></span></button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<dialog id="dialog"><form method="dialog" id="dialog-form"></form></dialog>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
