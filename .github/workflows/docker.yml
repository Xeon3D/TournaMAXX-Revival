# Every published GitHub release builds the Docker image (amd64 and arm64) and
# pushes it to Docker Hub as xeon3d/tournamaxx-revival.
#
# A release tagged v1.2.3 becomes the tags 1.2.3, 1.2, v1.2.3 and latest (a
# pre-release gets only its own tags, not latest).  A tag that is not a
# version (e.g. "spring-2027") is pushed under its own name.  It can also be
# run by hand (Actions > Docker image > Run workflow) to rebuild the current
# commit as "edge".
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME   the Docker Hub user (xeon3d)
#   DOCKERHUB_TOKEN      a Docker Hub access token with Read & Write access

name: Docker image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: xeon3d/tournamaxx-revival

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag,enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      # No RUN steps in the Dockerfile, so arm64 builds without QEMU.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
