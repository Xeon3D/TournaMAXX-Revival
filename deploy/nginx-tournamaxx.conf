# The control panel, for install.sh (__DOMAIN__ is filled in).  certbot
# --nginx adds the HTTPS server and the redirect to it.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Update packages and files for the cabinets are uploaded through it.
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
